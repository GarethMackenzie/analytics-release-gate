name: Bug report
description: Report an incorrect result, crash or regression
title: "[Bug] "
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Remove secrets and private data before posting fixtures.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Analytics Release Gate version
