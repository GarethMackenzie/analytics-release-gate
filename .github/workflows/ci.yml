name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Tests
        run: pytest --cov=analytics_release_gate --cov-report=term-missing

      - name: Package build
        run: python -m build

      - name: Wheel smoke test
        run: |
          python -m pip install --force-reinstall dist/*.whl
          argate --version
          argate audit . --format json --output /tmp/argate.json || test $? -eq 1
          test -s /tmp/argate.json
