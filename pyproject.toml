[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-release-gate"
version = "0.1.0"
description = "Open-source release gate for analytics and Power BI repositories."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gareth Mackenzie" }]
keywords = ["analytics-engineering", "power-bi", "data-quality", "release-gate", "tmdl", "pbip"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/GarethMackenzie/analytics-release-gate"
Repository = "https://github.com/GarethMackenzie/analytics-release-gate"
Issues = "https://github.com/GarethMackenzie/analytics-release-gate/issues"

[project.scripts]
argate = "analytics_release_gate.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["analytics_release_gate"]
mypy_path = "src"

[tool.analytics-release-gate]
exclude = []
fail-on = ["FAIL"]
